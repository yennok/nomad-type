<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><title>Orange check</title>
<style>
@font-face{font-family:"SafraMono";src:url("fonts/SafraMono-Mono.woff2") format("woff2");}
html,body{margin:0;height:100%;background:#181C20;font-family:"SafraMono",monospace;color:#181C20}
.wrap{display:flex;flex-direction:column;height:100%}
.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;font-size:14px;line-height:1.5}
.a{background:#FF3D00}
.b{background:#FF3D00;background:color(display-p3 1 0.2392 0)}
.info{background:#181C20;color:#fff;padding:14px 20px calc(14px + env(safe-area-inset-bottom));font-size:12px;line-height:1.5}
</style></head><body><div class="wrap">
<div class="sw a"><b>A</b>#FF3D00 as written (sRGB). The same orange on every screen.</div>
<div class="sw b"><b>B</b>What the Techno page uses now: the same numbers as Display P3. On a P3 screen (every iPhone, Mac screens) it turns redder.</div>
<div class="info" id="info"></div></div>
<script>
var p3 = matchMedia('(color-gamut: p3)').matches;
document.getElementById('info').textContent = 'This screen: ' + (p3 ? 'wide color (P3), so A and B look different here.' : 'regular (sRGB), so A and B look the same here.');
</script></body></html>
