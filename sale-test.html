<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow">
  <title>End of Year Sale | Nomad Type</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
  @font-face { font-family: "Techno"; font-weight: 700; src: url("fonts/Techno/Techno-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Dolomit"; font-weight: 700; src: url("fonts/Dolomit/Dolomit-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Kilo Text"; font-weight: 400; src: url("fonts/Kilo-Text/KILOTextV5-Regular.woff2") format("woff2"); }
  body.sale-page { --primary-color: #E8FF3A; }
  body.sale-page .cover-title div { font-family: "Safra Sans", sans-serif; font-weight: 700; font-size: 150px; line-height: .95; color: #000; text-align: center; }
  body.sale-page .cover-buttons { display: none !important; }

  .sale-list { font-family: "Safra Mono", monospace; font-size: 14px; margin: 40px 0 180px; }
  .sale-head { display: flex; justify-content: space-between; gap: 16px; border-bottom: 1px solid #000; padding-bottom: 10px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto 170px; align-items: center; gap: 18px; border-bottom: 1px solid #000; padding: 18px 0; }
  .tick { width: 18px; height: 18px; border: 1px solid #000; background: #fff; padding: 0; cursor: pointer; position: relative; }
  .row.on .tick::after { content: ''; position: absolute; inset: 3px; background: #FF4802; }
  .row-name { font-size: 54px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; color: #000; text-decoration: none; }
  .row-chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 560px; }
  .chip { font: inherit; font-size: 12px; border: 1px solid #000; border-radius: 30px; padding: 6px 11px; white-space: nowrap; background: #fff; color: #000; cursor: pointer; }
  .chip.on { background: #000; color: #fff; }
  .row-price { text-align: right; white-space: nowrap; }
  .row-price s { opacity: .4; margin-right: 6px; }
  .row-more { display: inline-block; margin-top: 4px; font-size: 11px; opacity: .5; color: inherit; }

  .order-bar { position: fixed; left: 30px; right: 30px; bottom: 18px; z-index: 900; background: #000; color: #fff; border-radius: 14px;
     font: 14px/1.3 "Safra Mono", monospace; padding: 12px 14px 12px 18px; display: flex; align-items: center; gap: 14px;
     transform: translateY(140%); transition: transform .25s ease; }
  .order-bar.show { transform: none; }
  .order-bar .what { flex: 1; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .order-bar select { font: inherit; font-size: 14px; color: #fff; background: #000; border: 1px solid #fff; border-radius: 8px; padding: 7px 10px; }
  .order-bar .total { white-space: nowrap; }
  .order-bar .total s { opacity: .5; margin-right: 6px; }
  .order-bar .go { font: inherit; background: #E8FF3A; color: #000; border: 0; border-radius: 8px; padding: 10px 16px; white-space: nowrap; cursor: pointer; }
  .note { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #fff; color: #000; border: 1px solid #000; border-radius: 10px;
     font: 13px/1.4 "Safra Mono", monospace; padding: 10px 14px; z-index: 901; max-width: 90vw; display: none; }

  @media (max-width: 768px) {
    body.sale-page .cover-title div { font-size: 54px; }
    .sale-head { flex-direction: column; gap: 4px; }
    .row { grid-template-columns: 28px 1fr; gap: 10px 12px; padding: 16px 0; }
    .row-name { font-size: 38px; }
    .row-chips, .row-price { grid-column: 2; justify-content: flex-start; text-align: left; }
    .chip { font-size: 13px; padding: 9px 12px; }
    .order-bar { left: 10px; right: 10px; bottom: 10px; flex-wrap: wrap; gap: 8px 10px; padding: 12px; }
    .order-bar .what { flex-basis: 100%; order: -1; }
    .order-bar select { font-size: 16px; flex: 1 1 calc(50% - 5px); min-width: 0; padding: 7px 6px; }
    .order-bar .go { margin-left: auto; }
    .note { bottom: 150px; }
  }
  </style>
</head>
<body class="sale-page">
  <div id="header-container"></div>
  <main class="content-wrapper">
    <section class="sale-list">
      <div class="sale-head"><span>Every typeface · 50% off</span><span id="headNote">prices before VAT</span></div>
      <div id="rows"></div>
    </section>
  </main>
  <div class="order-bar" id="bar">
    <span class="what" id="what"></span>
    <select id="use" aria-label="Intended use"><option value="desktop">Desktop</option><option value="web">Web</option><option value="bundle">Desktop + Web</option></select>
    <select id="tier" aria-label="Users"><option value="individual">Individual</option><option value="studio">Studio ≤ 5 users</option><option value="company">Company ≤ 20 users</option></select>
    <span class="total" id="total"></span>
    <button class="go" id="go" type="button">Continue →</button>
  </div>
  <div class="note" id="note">Test page: checkout is not connected yet.</div>
  <div id="footer-container"></div>

  <script>
  (function () {
    var FONTS = [{"key": "safra", "name": "Safra", "face": "Safra", "w": 400, "page": "safra", "styles": [{"id": "entire", "label": "Full Family (4)", "family": true}, {"id": "regular", "label": "Safra Regular", "family": false}, {"id": "bold", "label": "Safra Bold", "family": false}, {"id": "sans-regular", "label": "Safra Sans Regular", "family": false}, {"id": "sans-bold", "label": "Safra Sans Bold", "family": false}], "ils": {"single": {"desktop": {"individual": 350, "studio": 560, "company": 1400}, "web": {"individual": 520, "studio": 840, "company": 2100}, "bundle": {"individual": 700, "studio": 1120, "company": 2800}}, "family": {"desktop": {"individual": 980, "studio": 1540, "company": 3920}, "web": {"individual": 1470, "studio": 2310, "company": 5880}, "bundle": {"individual": 1960, "studio": 3080, "company": 7840}}}}, {"key": "techno", "name": "Techno", "face": "Techno", "w": 700, "page": "techno-test", "styles": [{"id": "entire", "label": "Full Family (4)", "family": true}, {"id": "bold", "label": "Techno Bold", "family": false}, {"id": "slanted-bold", "label": "Techno Bold Slanted", "family": false}, {"id": "extended-bold", "label": "Techno Extended Bold", "family": false}, {"id": "extended-slanted-bold", "label": "Techno Extended Bold Slanted", "family": false}], "ils": {"single": {"desktop": {"individual": 350, "studio": 560, "company": 1400}, "web": {"individual": 520, "studio": 840, "company": 2100}, "bundle": {"individual": 700, "studio": 1120, "company": 2800}}, "family": {"desktop": {"individual": 980, "studio": 1540, "company": 3920}, "web": {"individual": 1470, "studio": 2310, "company": 5880}, "bundle": {"individual": 1960, "studio": 3080, "company": 7840}}}}, {"key": "dolomit", "name": "Dolomit", "face": "Dolomit", "w": 700, "page": "dolomit", "styles": [{"id": "entire", "label": "Full Family (2)", "family": true}, {"id": "bold", "label": "Dolomit Bold", "family": false}, {"id": "bold-extended", "label": "Dolomit Bold Extended", "family": false}], "ils": {"single": {"desktop": {"individual": 300, "studio": 480, "company": 1200}, "web": {"individual": 460, "studio": 720, "company": 1800}, "bundle": {"individual": 600, "studio": 950, "company": 2400}}, "family": {"desktop": {"individual": 560, "studio": 850, "company": 2190}, "web": {"individual": 850, "studio": 1270, "company": 3280}, "bundle": {"individual": 1130, "studio": 1690, "company": 4380}}}}, {"key": "middle-east", "name": "Middle East", "face": "MiddleEast", "w": 400, "page": "middle-east", "styles": [{"id": "single", "label": "Middle East", "family": false}], "ils": {"single": {"desktop": {"individual": 350, "studio": 560, "company": 1400}, "web": {"individual": 520, "studio": 840, "company": 2100}, "bundle": {"individual": 700, "studio": 1120, "company": 2800}}}}, {"key": "sugar", "name": "Sugar", "face": "Sugar Display", "w": 400, "page": "sugar", "styles": [{"id": "entire", "label": "Full Family (2)", "family": true}, {"id": "display", "label": "Sugar Display", "family": false}, {"id": "text", "label": "Sugar Text", "family": false}], "ils": {"single": {"desktop": {"individual": 300, "studio": 480, "company": 1200}, "web": {"individual": 460, "studio": 720, "company": 1800}, "bundle": {"individual": 600, "studio": 950, "company": 2400}}, "family": {"desktop": {"individual": 560, "studio": 850, "company": 2190}, "web": {"individual": 850, "studio": 1270, "company": 3280}, "bundle": {"individual": 1130, "studio": 1690, "company": 4380}}}}, {"key": "werd", "name": "Werd", "face": "Werd", "w": 700, "page": "werd", "styles": [{"id": "entire", "label": "Full Family (5)", "family": true}, {"id": "regular", "label": "Werd Regular", "family": false}, {"id": "light", "label": "Werd Light", "family": false}, {"id": "bold", "label": "Werd Bold", "family": false}, {"id": "extrabold", "label": "Werd Extra Bold", "family": false}, {"id": "black", "label": "Werd Black", "family": false}], "ils": {"single": {"desktop": {"individual": 350, "studio": 560, "company": 1400}, "web": {"individual": 520, "studio": 840, "company": 2100}, "bundle": {"individual": 700, "studio": 1120, "company": 2800}}, "family": {"desktop": {"individual": 1120, "studio": 1820, "company": 4550}, "web": {"individual": 1680, "studio": 2730, "company": 6820}, "bundle": {"individual": 2240, "studio": 3640, "company": 9100}}}}, {"key": "kaldanit", "name": "Kaldanit", "face": "Kaldanit", "w": 700, "page": "kaldanit", "styles": [{"id": "entire", "label": "Full Family (3)", "family": true}, {"id": "regular", "label": "Kaldanit Regular", "family": false}, {"id": "bold", "label": "Kaldanit Bold", "family": false}, {"id": "italic", "label": "Kaldanit Italic", "family": false}], "ils": {"single": {"desktop": {"individual": 350, "studio": 560, "company": 1400}, "web": {"individual": 520, "studio": 840, "company": 2100}, "bundle": {"individual": 700, "studio": 1120, "company": 2800}}, "family": {"desktop": {"individual": 840, "studio": 1330, "company": 3360}, "web": {"individual": 1260, "studio": 2000, "company": 5040}, "bundle": {"individual": 1680, "studio": 2660, "company": 6720}}}}, {"key": "kilo-display", "name": "Kilo Display", "face": "Kilo Display", "w": 400, "page": "kilo-display", "styles": [{"id": "entire", "label": "Full Family (4)", "family": true}, {"id": "super-narrow", "label": "KILO Super Narrow", "family": false}, {"id": "narrow", "label": "KILO Narrow", "family": false}, {"id": "compact", "label": "KILO Compact", "family": false}, {"id": "standard", "label": "KILO Standard", "family": false}], "ils": {"single": {"desktop": {"individual": 300, "studio": 480, "company": 1200}, "web": {"individual": 460, "studio": 720, "company": 1800}, "bundle": {"individual": 600, "studio": 950, "company": 2400}}, "family": {"desktop": {"individual": 850, "studio": 1340, "company": 3390}, "web": {"individual": 1270, "studio": 2010, "company": 5080}, "bundle": {"individual": 1690, "studio": 2680, "company": 6780}}}}, {"key": "kilo-text", "name": "Kilo Text", "face": "Kilo Text", "w": 400, "page": "kilo-text", "styles": [{"id": "single", "label": "Kilo Text", "family": false}], "ils": {"single": {"desktop": {"individual": 300, "studio": 480, "company": 1200}, "web": {"individual": 460, "studio": 720, "company": 1800}, "bundle": {"individual": 600, "studio": 950, "company": 2400}}}}, {"key": "yeffe", "name": "Yeffe Nefesh", "face": "Yeffe Nefesh", "w": 400, "page": "yeffe", "styles": [{"id": "single", "label": "Yeffe Nefesh", "family": false}], "ils": {"single": {"desktop": {"individual": 300, "studio": 480, "company": 1200}, "web": {"individual": 460, "studio": 720, "company": 1800}, "bundle": {"individual": 600, "studio": 950, "company": 2400}}}}, {"key": "spitz", "name": "Romanisch Spitz", "face": "Romanisch Spitz", "w": 400, "page": "spitz", "styles": [{"id": "single", "label": "Romanisch Spitz", "family": false}], "ils": {"single": {"desktop": {"individual": 350, "studio": 560, "company": 1400}, "web": {"individual": 520, "studio": 840, "company": 2100}, "bundle": {"individual": 700, "studio": 1120, "company": 2800}}}}];
    var picked = {};               // key -> set of style ids
    var $ = function (id) { return document.getElementById(id); };
    function opt() { return { use: $('use').value, tier: $('tier').value }; }
    function famStyle(f) { for (var i = 0; i < f.styles.length; i++) if (f.styles[i].family) return f.styles[i]; return null; }
    /* full (pre-sale) price of what is picked in one row */
    function rowFull(f) {
      var p = picked[f.key]; if (!p || !p.size) return 0;
      var o = opt(), fam = famStyle(f);
      if (fam && p.has(fam.id)) return f.ils.family[o.use][o.tier];
      return p.size * f.ils.single[o.use][o.tier];
    }
    function half(n) { return Math.round(n / 2); }
    function fmt(n) { return '₪' + n.toLocaleString('en-US'); }

    function draw() {
      var o = opt(), html = '';
      FONTS.forEach(function (f) {
        var p = picked[f.key], on = p && p.size;
        var chips = f.styles.length > 1 ? f.styles.map(function (s) {
          var lab = s.label.indexOf(f.name + ' ') === 0 ? s.label.slice(f.name.length + 1) : s.label;
          return '<button type="button" class="chip' + (on && p.has(s.id) ? ' on' : '') + '" data-f="' + f.key + '" data-s="' + s.id + '">' + lab + '</button>';
        }).join('') : '';
        var full = on ? rowFull(f) : f.ils.single[o.use][o.tier];
        var price = '<s>' + fmt(full) + '</s>' + (on ? '' : 'from ') + fmt(half(full));
        html += '<div class="row' + (on ? ' on' : '') + '" data-f="' + f.key + '">' +
          '<button type="button" class="tick" aria-label="Add ' + f.name + '" data-f="' + f.key + '"></button>' +
          '<div><div class="row-name" data-f="' + f.key + '" style="font-family:\'' + f.face + '\'; font-weight:' + f.w + '">' + f.name + '</div>' +
          '<a class="row-more" href="' + f.page + '">see ' + f.name + ' →</a></div>' +
          '<div class="row-chips">' + chips + '</div>' +
          '<div class="row-price">' + price + '</div></div>';
      });
      $('rows').innerHTML = html;

      var full = 0, names = [];
      FONTS.forEach(function (f) {
        var p = picked[f.key]; if (!p || !p.size) return;
        full += rowFull(f);
        var fam = famStyle(f);
        if (f.styles.length === 1) names.push(f.name);
        else if (fam && p.has(fam.id)) names.push(f.name + ' ' + fam.label);
        else names.push(f.styles.filter(function (s) { return p.has(s.id); }).map(function (s) { return s.label; }).join(', '));
      });
      $('what').textContent = names.join(' · ');
      $('total').innerHTML = '<s>' + fmt(full) + '</s>' + fmt(half(full)) + ' + VAT';
      $('bar').classList.toggle('show', full > 0);
      $('headNote').textContent = 'prices before VAT · ' + $('use').selectedOptions[0].text + ' · ' + $('tier').selectedOptions[0].text;
    }

    function toggleFont(k) {
      var f = FONTS.filter(function (x) { return x.key === k; })[0];
      if (picked[k] && picked[k].size) { delete picked[k]; return; }
      /* a new row starts with the whole family when there is one, otherwise the single style */
      var fam = famStyle(f);
      picked[k] = new Set([fam ? fam.id : f.styles[0].id]);
    }
    function toggleStyle(k, s) {
      var f = FONTS.filter(function (x) { return x.key === k; })[0], fam = famStyle(f);
      var p = picked[k] || (picked[k] = new Set());
      if (p.has(s)) { p.delete(s); }
      else if (fam && s === fam.id) { p.clear(); p.add(s); }          // the family replaces single styles
      else {
        if (fam) p.delete(fam.id);
        p.add(s);
        /* once the single styles cost as much as the family (or more), the family is the better deal: switch to it */
        var o = opt();
        if (fam && p.size * f.ils.single[o.use][o.tier] >= f.ils.family[o.use][o.tier]) { p.clear(); p.add(fam.id); }
      }
      if (!p.size) delete picked[k];
    }

    document.addEventListener('click', function (e) {
      var t = e.target.closest('.tick, .row-name, .chip');
      if (!t) return;
      if (t.classList.contains('chip')) toggleStyle(t.dataset.f, t.dataset.s); else toggleFont(t.dataset.f);
      draw();
    });
    $('use').addEventListener('change', draw);
    $('tier').addEventListener('change', draw);
    $('go').addEventListener('click', function () {
      var n = $('note'); n.style.display = 'block'; clearTimeout(n._t); n._t = setTimeout(function () { n.style.display = 'none'; }, 2600);
    });
    draw();
  })();
  </script>
  <script src="header.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { if (typeof loadHeader === 'function') loadHeader('<div>End of Year Sale</div><div>50% OFF</div>'); });</script>
  <script src="footer.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { if (typeof loadFooter === 'function') loadFooter('Sale'); });</script>
</body>
</html>
