<!doctype html>
<html lang="he"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Dolomit";font-weight:700;src:url(file:///home/user/nomad-type/fonts/Dolomit/Dolomit-Bold.woff2) format("woff2");font-display:block}
@font-face{font-family:"Dolomit Ext";font-weight:700;src:url(file:///home/user/nomad-type/fonts/Dolomit/Dolomit-BoldExtended.woff2) format("woff2");font-display:block}
@font-face{font-family:"Safra";font-weight:700;src:url(file:///home/user/nomad-type/fonts/Safra-Bold.woff2) format("woff2");font-display:block}
@font-face{font-family:"Safra";font-weight:400;src:url(file:///home/user/nomad-type/fonts/Safra-Regular.woff2) format("woff2");font-display:block}
@font-face{font-family:"Safra Sans";font-weight:700;src:url(file:///home/user/nomad-type/fonts/SafraSans-Bold.woff2) format("woff2");font-display:block}
@font-face{font-family:"Safra Sans";font-weight:400;src:url(file:///home/user/nomad-type/fonts/SafraSans-Regular.woff2) format("woff2");font-display:block}
*{box-sizing:border-box;margin:0} html,body{background:#000}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden}
canvas{position:absolute;inset:0}
.slip{position:absolute;left:260px;top:315px;width:560px;height:720px;background:#fff}
.big{position:absolute;left:30px;right:30px;top:90px;height:330px;display:flex;align-items:center;justify-content:center;color:#0A0A0A;white-space:nowrap;line-height:1}
.rule{position:absolute;left:140px;right:140px;top:500px;height:4px;background:#0A0A0A}
.name{position:absolute;left:30px;right:30px;top:540px;height:90px;display:flex;align-items:center;justify-content:center;color:#0A0A0A;font-size:54px;white-space:nowrap;line-height:1}
</style></head><body>
<div id="stage"><canvas id="g" width="1080" height="1350"></canvas>
  <div class="slip"><div class="big" id="big"></div><div class="rule"></div><div class="name" id="name"></div></div>
</div>
<script>
var INK='#0A0A0A',PAP='#FFFFFF',YEL='#E8FF3A',RED='#FF3B21',BLU='#2045DE',GRY='#C7C7C7';
/* Arabic is set in the Regular weights: Safra Bold has no final lam and Safra Sans Bold no hamza alef.
   each slide is a ballot slip: the letters big, a rule, the name small, as the real slip is laid out.
   Nothing here is a party's letter: ת, ש, ח and א are not on the 26th Knesset's list. */
var SLIDES=[
  {g:BLU, big:'ת',      bf:'"Dolomit Ext"', bw:700, bs:300, name:'תקווה', nf:'"Dolomit"',     nw:700},
  {g:YEL, big:'תקווה',  bf:'"Dolomit Ext"', bw:700, bs:150, name:'أمل',   nf:'"Safra"',       nw:400},
  {g:RED, big:'أمل',    bf:'"Safra"',       bw:400, bs:260, name:'תקווה', nf:'"Safra"',       nw:400},
  {g:GRY, big:'أمل',    bf:'"Safra Sans"',  bw:400, bs:260, name:'תקווה', nf:'"Safra Sans"',  nw:700},
  {g:BLU, big:'ש',      bf:'"Safra"',       bw:700, bs:300, name:'שלום',  nf:'"Safra"',       nw:700},
  {g:INK, big:'سلام',   bf:'"Safra"',       bw:700, bs:200, name:'שלום',  nf:'"Safra"',       nw:400},
  {g:YEL, big:'ח',      bf:'"Safra Sans"',  bw:700, bs:300, name:'חיים',  nf:'"Safra Sans"',  nw:700},
  {g:RED, big:'א',      bf:'"Dolomit Ext"', bw:700, bs:300, name:'אחווה', nf:'"Dolomit"',     nw:700},
  {g:BLU, big:'תקווה',  bf:'"Dolomit Ext"', bw:700, bs:150, name:'أمل · תקווה', nf:'"Safra"', nw:400}
];
function ground(c,seed){
  var cv=document.getElementById('g'), x=cv.getContext('2d'); x.fillStyle=c; x.fillRect(0,0,1080,1350);
  if(c!==GRY) return;                                   // grey always carries grain, nothing else does
  var im=x.getImageData(0,0,1080,1350), d=im.data, s=987654321+seed*7919;
  function r(){ s=(s*1664525+1013904223)&0x7fffffff; return s/0x7fffffff; }
  for(var i=0;i<d.length;i+=4) if(r()<0.055){ d[i]=10; d[i+1]=10; d[i+2]=10; }
  x.putImageData(im,0,0);
}
function fit(el,max){ el.style.fontSize=max+'px'; var w=el.scrollWidth, lim=el.clientWidth; if(w>lim) el.style.fontSize=(max*lim/w)+'px'; }
window.__slide=function(n){
  var s=SLIDES[n]; ground(s.g,n);
  var b=document.getElementById('big'), m=document.getElementById('name');
  b.textContent=s.big; b.style.fontFamily=s.bf; b.style.fontWeight=s.bw; b.dir='rtl'; fit(b,s.bs);
  m.textContent=s.name; m.style.fontFamily=s.nf; m.style.fontWeight=s.nw; m.dir='rtl'; fit(m,54);
  return SLIDES.length;
};
window.__ready=Promise.all(['700 100px "Dolomit"','700 100px "Dolomit Ext"','700 100px "Safra"','400 100px "Safra"','700 100px "Safra Sans"','400 100px "Safra Sans"'].map(function(f){return document.fonts.load(f,'أمل سلام תקווה');})).then(function(){return document.fonts.ready;});
</script></body></html>
